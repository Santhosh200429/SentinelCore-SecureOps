spring.config.import=optional:file:.env[.properties]

spring.application.name=dashboard

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# HikariCP
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# Server
server.port=${SERVER_PORT:${PORT:8080}}

# Timezone
spring.jackson.time-zone=Asia/Kolkata

# Session cookie (for Vercel + Render use: SESSION_COOKIE_SAME_SITE=none and SESSION_COOKIE_SECURE=true)
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Mail
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

spring.mail.test-connection=false

# Live telemetry
app.data.mode=${APP_DATA_MODE:live}
telemetry.interval.seconds=${TELEMETRY_INTERVAL_SECONDS:5}

alert.cpu.threshold=${CPU_ALERT_THRESHOLD:90}
alert.memory.threshold=${MEMORY_ALERT_THRESHOLD:90}
alert.disk.threshold=${DISK_ALERT_THRESHOLD:90}

asset.offline-timeout-seconds=${ASSET_OFFLINE_TIMEOUT_SECONDS:60}

alerts.auto-create-incidents=${AUTO_CREATE_INCIDENTS:false}

nvd.api-key=${NVD_API_KEY:}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoints.web.base-path=/actuator
management.server.port=${MANAGEMENT_PORT:${server.port}}

# DevTools
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false