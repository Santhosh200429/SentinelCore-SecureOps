# ============================================================
# SentinelCore Test Configuration
# ============================================================

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:sentinelcoretest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Don't initialize external SQL scripts
spring.sql.init.mode=never

# Mail bean must exist during Spring tests,
# but tests must NOT connect to Gmail.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.from=test@example.com

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false

# Test application settings
app.data.mode=demo
telemetry.interval.seconds=3600

asset.offline-timeout-seconds=60

alert.cpu.threshold=90
alert.memory.threshold=90
alert.disk.threshold=90

alerts.auto-create-incidents=false

# Random port for tests
server.port=0

# Actuator
management.endpoints.web.exposure.include=health