<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Cyan glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Shield -->
  <path d="M50 12 L85 25 L85 55 C85 75 50 88 50 88 C50 88 15 75 15 55 L15 25 Z" fill="none" stroke="#B71C1C" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner Shield (Glow) -->
  <path d="M50 20 L75 30 L75 52 C75 68 50 78 50 78 C50 78 25 68 25 52 L25 30 Z" fill="none" stroke="#00D2FF" stroke-width="2" stroke-linejoin="round" filter="url(#glow-cyan)"/>
  <!-- Center Core -->
  <polygon points="50,32 63,45 57,63 43,63 37,45" fill="#B71C1C" opacity="0.8"/>
  <circle cx="50" cy="48" r="5" fill="#FFFFFF" filter="url(#glow-cyan)"/>
  <!-- Target Grid Lines -->
  <line x1="50" y1="20" x2="50" y2="78" stroke="#00D2FF" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.3"/>
  <line x1="25" y1="48" x2="75" y2="48" stroke="#00D2FF" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.3"/>
</svg>
